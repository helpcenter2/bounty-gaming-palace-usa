<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounty Gaming Palace USA</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background: radial-gradient(circle at top, #1a1a2e, #0b0b1a);
    overflow-x: hidden;
}

/* Neon animated background */
body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg,#ffcc00,#ff0066,#00c3ff,#ffcc00);
    background-size: 400% 400%;
    animation: glow 12s linear infinite;
    opacity: 0.15;
    z-index: -1;
}

@keyframes glow {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Header */
header {
    padding: 30px;
    background: linear-gradient(90deg, #ffcc00, #ff0066);
    box-shadow: 0 0 20px #ff0066;
}

/* Layout */
.container {
    padding: 30px;
}

/* Cards */
.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    margin: 20px auto;
    width: 90%;
    max-width: 500px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

/* Buttons */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 14px 25px;
    background: linear-gradient(45deg,#ff0066,#ffcc00);
    color: black;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
}

/* Slot machine */
.slot-box {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
}

.reel {
    width: 70px;
    height: 70px;
    background: #111;
    border: 2px solid #ffcc00;
    border-radius: 10px;
    font-size: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.spin {
    animation: spinAnim 0.3s linear infinite;
}

@keyframes spinAnim {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(360deg); }
}

/* Floating WhatsApp */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    padding: 15px 18px;
    border-radius: 50%;
    font-size: 20px;
    text-decoration: none;
    box-shadow: 0 0 10px #25D366;
}

/* WIN POPUP */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: black;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid gold;
    display: none;
    z-index: 999;
}

/* Confetti */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: gold;
    top: 0;
    animation: fall 2s linear infinite;
}

@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); }
}
</style>
</head>

<body>

<header>
    <img src="logo.png" alt="Logo" style="width:100px; border-radius:15px; margin-bottom:10px;">
    <h1>🎰 Bounty Gaming Palace USA 🎰</h1>
    <p>VIP Casino & Entertainment Experience</p>
</header>

<div class="container">

    <div class="card">
        <h2>🔥 Join Facebook</h2>
        <a class="btn" href="https://www.facebook.com/BountyGamingPalaceUSA/" target="_blank">
            Visit Page
        </a>
    </div>

    <div class="card">
        <h2>📱 Contact</h2>
        <a class="btn" href="https://wa.me/14244414732" target="_blank">
            WhatsApp Us
        </a>
        <p>📍 VIP Lounge, Los Angeles, USA</p>
    </div>

    <div class="card">
        <h2>🎰 Slot Machine</h2>

        <div class="slot-box">
            <div class="reel" id="r1">🍒</div>
            <div class="reel" id="r2">💎</div>
            <div class="reel" id="r3">🔔</div>
        </div>

        <button class="btn" onclick="spin()">SPIN 🎲</button>
    </div>

</div>

<!-- Floating WhatsApp -->
<a class="whatsapp" href="https://wa.me/14244414732" target="_blank">💬</a>

<!-- WIN POPUP -->
<div class="popup" id="popup">
    🎉 JACKPOT WIN! 🎉
</div>

<script>
function spin() {
    const symbols = ["🍒","💎","🔔","🍋","⭐","7️⃣"];

    let r1 = document.getElementById("r1");
    let r2 = document.getElementById("r2");
    let r3 = document.getElementById("r3");

    r1.classList.add("spin");
    r2.classList.add("spin");
    r3.classList.add("spin");

    let interval = setInterval(() => {
        r1.innerText = symbols[Math.floor(Math.random()*symbols.length)];
        r2.innerText = symbols[Math.floor(Math.random()*symbols.length)];
        r3.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    }, 100);

    setTimeout(() => {
        clearInterval(interval);
        r1.classList.remove("spin");
        r2.classList.remove("spin");
        r3.classList.remove("spin");

        showWin();
    }, 2000);
}

function showWin() {
    let popup = document.getElementById("popup");
    popup.style.display = "block";

    for (let i = 0; i < 30; i++) {
        let c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = ["#ffcc00","#ff0066","#00c3ff"][Math.floor(Math.random()*3)];
        document.body.appendChild(c);

        setTimeout(() => c.remove(), 2000);
    }

    setTimeout(() => {
        popup.style.display = "none";
    }, 2500);
}
</script>

</body>
</html>
