<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounty Gaming Palace USA</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow-x: hidden;
    background: radial-gradient(circle at top, #1a1a2e, #0b0b1a);
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg,#ffcc00,#ff0066,#00c3ff,#ffcc00);
    background-size: 400% 400%;
    animation: casinoGlow 10s linear infinite;
    opacity: 0.15;
    z-index: -1;
}

@keyframes casinoGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Header */
header {
    background: linear-gradient(90deg, #ffcc00, #ff0066);
    padding: 25px;
}

/* Layout */
.container {
    padding: 40px;
}

/* Cards */
.card {
    background: #1a1a2e;
    padding: 20px;
    margin: 20px auto;
    width: 85%;
    max-width: 500px;
    border-radius: 15px;
}

/* Buttons */
.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 25px;
    background: #ff0066;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

.btn:hover {
    background: #ffcc00;
    color: black;
}

/* Slot machine */
.slot-box {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
}

.reel {
    width: 70px;
    height: 70px;
    background: #111;
    border: 2px solid #ffcc00;
    border-radius: 10px;
    font-size: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.spin {
    animation: spinAnim 0.3s linear infinite;
}

@keyframes spinAnim {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(360deg); }
}

/* Floating WhatsApp */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    padding: 15px 18px;
    border-radius: 50%;
    font-size: 20px;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>🎰 Bounty Gaming Palace USA 🎰</h1>
    <p>Welcome to the ultimate gaming & entertainment hub</p>
</header>

<div class="container">

    <div class="card">
        <h2>🔥 Join Our Facebook</h2>
        <a class="btn" href="https://www.facebook.com/BountyGamingPalaceUSA/" target="_blank">
            Visit Facebook Page
        </a>
    </div>

    <div class="card">
        <h2>📱 Contact</h2>

        <a class="btn" href="https://wa.me/14244414732" target="_blank">
            Chat on WhatsApp
        </a>

        <br><br>

        <p>📍 VIP Lounge, Los Angeles, CA, United States</p>
    </div>

    <div class="card">
        <h2>🎰 Daily Jackpot Slot</h2>

        <div class="slot-box">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">💎</div>
            <div class="reel" id="reel3">🔔</div>
        </div>

        <button class="btn" onclick="spin()">SPIN 🎲</button>
    </div>

</div>

<!-- Floating WhatsApp -->
<a class="whatsapp" href="https://wa.me/14244414732" target="_blank">💬</a>

<script>
function spin() {
    const symbols = ["🍒","💎","🔔","🍋","⭐","7️⃣"];

    let r1 = document.getElementById("reel1");
    let r2 = document.getElementById("reel2");
    let r3 = document.getElementById("reel3");

    r1.classList.add("spin");
    r2.classList.add("spin");
    r3.classList.add("spin");

    let interval = setInterval(() => {
        r1.innerText = symbols[Math.floor(Math.random()*symbols.length)];
        r2.innerText = symbols[Math.floor(Math.random()*symbols.length)];
        r3.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    }, 100);

    setTimeout(() => {
        clearInterval(interval);
        r1.classList.remove("spin");
        r2.classList.remove("spin");
        r3.classList.remove("spin");
    }, 2000);
}
</script>

</body>
</html>
